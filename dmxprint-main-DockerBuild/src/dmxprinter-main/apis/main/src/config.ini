[DEBUG]
DEBUG_MODE = True
DEBUG_PORT = 5001
DEBUG_HOST = main
DEBUG_BY_ENCODE = 'utf-8'
DEBUG_DELAY = 0.2
DEBUG_CSV_DIR = ./output
DEBUG_TIMEOUT = 5.0
[PRINTER]
PRINTER_NAME = "DMXPrinter"
PRINTER_PORT = 5002
PRINTER_HOST = dmxprinter
PRINTER_BY_ENCODE = "utf-8"
PRINTER_DELAY = 0.1
PRINTER_RANK = ['1', '2', '3', '4', '5','6']
[CONVEYOR]
CONVEYOR_NAME = "DMXConveyor"
CONVEYOR_PORT = 5004
CONVEYOR_HOST = dmxconveyor
[UUID]
UUID_NAME = "DMXUUID"
UUID_PORT = 5003
UUID_HOST = uuid

[NG_SENSOR]
# NG検査装置（Ethernet/TCP）
# 192.168.100.110 から ERROR が返れば main が stop() して停止する
NG_HOST = 192.168.100.110
NG_PORT = 9004
# 接続後に送る文字列（空なら送信しない）
NG_SEND = LON\r
